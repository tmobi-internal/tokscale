.tab-bar button { background: #161b22; border: 1px solid #30363d; color: #8b949e; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }

function init() {
  // Stats
  const totalUsers = DATA.length;
  const allClients = new Map(), allModels = new Map(), allMcps = new Map();
  DATA.forEach(u => {
    u.clients.forEach(c => allClients.set(c, (allClients.get(c)||0)+1));
    u.models.forEach(m => allModels.set(m, (allModels.get(m)||0)+1));
    u.mcpServers.forEach(m => allMcps.set(m, (allMcps.get(m)||0)+1));
  });

  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="val">${totalUsers}</div><div class="lbl">Total Users</div></div>
    <div class="stat-card"><div class="val">${allClients.size}</div><div class="lbl">Clients</div></div>
    <div class="stat-card"><div class="val">${allModels.size}</div><div class="lbl">Models</div></div>
    <div class="stat-card"><div class="val">${allMcps.size}</div><div class="lbl">MCP Servers</div></div>
  `;

  // Tag clouds
  const sorted = (map) => [...map.entries()].sort((a,b) => b[1]-a[1]);
  const clientCloud = document.getElementById('clientCloud');
  sorted(allClients).forEach(([name, cnt]) => {
    clientCloud.innerHTML += `<span class="tag tag-client">${name}<span class="count">(${cnt})</span></span>`;
  });
  const modelCloud = document.getElementById('modelCloud');
  sorted(allModels).filter(([n]) => n !== '<synthetic>' && n !== 'unknown').slice(0, 30).forEach(([name, cnt]) => {
    modelCloud.innerHTML += `<span class="tag tag-model">${name}<span class="count">(${cnt})</span></span>`;
  });
  const mcpCloud = document.getElementById('mcpCloud');
  sorted(allMcps).slice(0, 30).forEach(([name, cnt]) => {
    mcpCloud.innerHTML += `<span class="tag tag-mcp">${name}<span class="count">(${cnt})</span></span>`;
  });

  // User table
  renderTable(DATA);
}

function renderTable(users) {
  const tbody = document.getElementById('userTable');
  tbody.innerHTML = users.map((u, i) => `
    <tr>
      <td>${i+1}</td>
      <td>${u.name}</td>
      <td class="tools">${u.clients.map(c => `<span class="pill pill-client">${c}</span>`).join('')}</td>
      <td class="tools">${u.models.filter(m => m !== '<synthetic>' && m !== 'unknown').slice(0,8).map(m => `<span class="pill pill-model">${m}</span>`).join('')}${u.models.length > 8 ? `<span class="pill pill-model">+${u.models.length-8}</span>` : ''}</td>
      <td class="tools">${u.mcpServers.map(m => `<span class="pill pill-mcp">${m}</span>`).join('') || '<span style="color:#555">-</span>'}</td>
    </tr>
  `).join('');
}

function filterTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = DATA.filter(u =>
    u.name.toLowerCase().includes(q) ||
    u.clients.some(c => c.toLowerCase().includes(q)) ||
    u.models.some(m => m.toLowerCase().includes(q)) ||
    u.mcpServers.some(m => m.toLowerCase().includes(q))
  );
  renderTable(filtered);
}

function showTab(tab) {
  document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('summary').classList.toggle('hidden', tab !== 'summary');
  document.getElementById('users').classList.toggle('hidden', tab !== 'users');
}

init();
</script>
